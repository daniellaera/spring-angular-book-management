name: Deploy Spring and Angular App

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  packages: write  # push images to the Gitea container registry

env:
  REGISTRY_HOST: 192.168.1.103:3000
  REGISTRY: 192.168.1.103:3000/daniellaera   # <gitea-host>/<owner>

jobs:
  # 1. Filters which parts (backend/frontend) have changed
  detect-changes:
    name: Determine Changes
    runs-on: ubuntu-latest
    container: 192.168.1.103:3000/daniellaera/ci-java21-node24:24.04-1
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - name: Login to Gitea Registry
        run: echo "${{ secrets.GIT_PASSWORD }}" | docker login 192.168.1.103:3000 -u "${{ secrets.GIT_USERNAME }}" --password-stdin

      - uses: actions/checkout@v4
      # Using dorny/paths-filter (compatible with Gitea Actions)
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            deploy:
              - '.gitea/workflows/**'
              - 'deploy/**'

  # 2. Backend Build and Test
  build-and-test-backend:
    name: Build and Test Application (Backend)
    runs-on: ubuntu-latest
    container: 192.168.1.103:3000/daniellaera/ci-java21-node24:24.04-1
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Generate version BEFORE build
      - name: Set Version
        run: |
          VERSION="1.1.${{ github.run_number }}"
          echo "Building version: ${VERSION}"
          cd backend
          mvn versions:set -DnewVersion=${VERSION}

      - name: Build and Test Backend
        working-directory: ./backend
        run: mvn clean verify

      # ❌ Disabled on Gitea:
      # - name: Upload JaCoCo Coverage Report (Backend)
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: jacoco-report-backend
      #     path: backend/target/site/jacoco

      # ❌ Disabled on Gitea:
      # - name: Generate JaCoCo Badge (Backend)
      #   id: generate_badge_backend
      #   uses: cicirello/jacoco-badge-generator@v2
      #   with:
      #     jacoco-csv-file: backend/target/site/jacoco/jacoco.csv
      #     badges-directory: .github/badges
      #     generate-coverage-badge: true
      #     coverage-badge-filename: jacoco.svg
      #     generate-coverage-endpoint: true
      #     coverage-endpoint-filename: jacoco.json

      # ❌ Disabled on Gitea:
      # - name: Commit and push badges to badges branch (Backend)
      #   if: ${{ github.event_name != 'pull_request' }}
      #   run: |
      #     git config --global user.name 'github-actions'
      #     git config --global user.email 'github-actions[bot]@users.noreply.github.com'
      #     git checkout -B badges
      #     mkdir -p badges
      #     cp .github/badges/jacoco.svg badges/
      #     cp .github/badges/jacoco.json badges/
      #     git add badges/*
      #     git commit -m "Update JaCoCo coverage badges" || echo "No changes to commit"
      #     git push origin badges --force

  build-and-test-frontend:
    name: Build and Test Application (Frontend)
    runs-on: ubuntu-latest
    container: 192.168.1.103:3000/daniellaera/ci-java21-node24:bookworm-2
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Guard: Angular CLI 22, @angular/build and jsdom 31 need Node ^24.15.0 or >=26 (engines field; 25.x is not
      # supported). The legacy image tag 24.04-1 ships Node 24.11.1; this job uses bookworm-2 (Node 24.21.0).
      # Fail with a clear message instead of an Angular CLI engine error.
      - name: Guard - Node.js must be >= 24.15.0 (24.x) or >= 26
        run: |
          NODE_V="$(node -v)"
          echo "node: ${NODE_V}, npm: $(npm -v)"
          V="${NODE_V#v}"; MAJOR="${V%%.*}"
          at_least() { [ "$(printf '%s\n%s\n' "$V" "$1" | sort -V | head -n1)" = "$1" ]; }
          if { [ "$MAJOR" = "24" ] && at_least 24.15.0; } || [ "$MAJOR" -ge 26 ] 2>/dev/null; then
            echo "Node ${NODE_V} satisfies the Angular 22 requirement."
          else
            echo "::error::Node ${NODE_V} is not supported by Angular CLI 22 (needs ^24.15.0 or >=26.0.0). Use the CI image tag bookworm-2 (Node 24.21.0), not 24.04-1 (Node 24.11.1)."
            exit 1
          fi

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Tests
        working-directory: ./frontend
        run: npm run test -- --watch=false

      - name: Run build-script tests (PrimeUI licence generator)
        working-directory: ./frontend
        run: npm run test:scripts

  dockerize-and-deploy:
    name: Build Images, Push to Gitea Registry & Deploy
    runs-on: ubuntu-latest
    container: 192.168.1.103:3000/daniellaera/ci-java21-node24:bookworm-2
    needs: [ detect-changes, build-and-test-backend, build-and-test-frontend ]
    # A skipped test job (nothing changed there) must not skip the image job: by default a job whose
    # `needs` include a skipped job is skipped too. always() lifts that; the result checks keep failed
    # tests blocking the deploy, and a docs-only push (no backend/frontend/workflow/deploy change) builds nothing.
    if: ${{ always() && needs.detect-changes.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.build-and-test-backend.result) && contains(fromJSON('["success","skipped"]'), needs.build-and-test-frontend.result) && (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.deploy == 'true') }}
    steps:
      - uses: actions/checkout@v4

      # Guard: PrimeNG 22 needs a PrimeUI licence key at build time (docs/DEPLOYMENT.md, "PrimeUI licence").
      # Fail here, before any image is built or any deploy/rollback logic runs, if the secret is missing or empty.
      # The secret goes through env (never interpolated into the script) and its value is never printed.
      - name: Guard - PRIMEUI_LICENSE secret must be set
        env:
          PRIMEUI_LICENSE: ${{ secrets.PRIMEUI_LICENSE }}
        run: |
          if [ -z "$(printf '%s' "$PRIMEUI_LICENSE" | tr -d '[:space:]')" ]; then
            echo "::error::Gitea secret PRIMEUI_LICENSE is empty or missing. Refusing to deploy a frontend without a PrimeUI licence key. Add it in Repo > Settings > Actions > Secrets."
            exit 1
          fi
          echo "PRIMEUI_LICENSE secret is present."

      # Guard: the frontend image needs `docker build --secret ...,env=` (BuildKit). The job image ships a Docker
      # 20.10 client (no buildx); the daemon on the runner VM decides the rest. Fail early with a clear message
      # instead of a cryptic build error, still before any image build or deploy logic.
      - name: Guard - Docker must support BuildKit secrets (client and daemon >= 20.10)
        run: |
          CLIENT="$(docker version --format '{{.Client.Version}}' 2>/dev/null || true)"
          SERVER="$(docker version --format '{{.Server.Version}}' 2>/dev/null || true)"
          echo "docker client: ${CLIENT:-unknown}, daemon: ${SERVER:-unreachable}"
          at_least_20_10() { [ -n "$1" ] && [ "$(printf '%s\n20.10\n' "$1" | sort -V | head -n1)" = "20.10" ]; }
          if ! at_least_20_10 "$CLIENT" || ! at_least_20_10 "$SERVER"; then
            echo "::error::Docker client (${CLIENT:-unknown}) and daemon (${SERVER:-unreachable}) must both be >= 20.10 to build the frontend image with a BuildKit secret (docker build --secret id=primeui_license,env=PRIMEUI_LICENSE). Upgrade Docker on the runner VM or fix DOCKER_HOST/socket access."
            exit 1
          fi

      # Push credentials: repo secrets REGISTRY_PUSH_USER + REGISTRY_PUSH_TOKEN (Gitea token with package write).
      # The built-in Actions token is rejected by the registry, and Gitea refuses secret names starting with GITEA_.
      - name: Log in to the Gitea container registry
        env:
          REG_USER: ${{ secrets.REGISTRY_PUSH_USER }}
          REG_TOKEN: ${{ secrets.REGISTRY_PUSH_TOKEN }}
        run: echo "$REG_TOKEN" | docker login "$REGISTRY_HOST" -u "$REG_USER" --password-stdin

      - name: Generate Version
        id: version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build Backend Image
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg APP_VERSION=${{ steps.version.outputs.version }} \
            -t ${REGISTRY}/book-backend:latest \
            -t ${REGISTRY}/book-backend:${{ steps.version.outputs.version }} \
            -t ${REGISTRY}/book-backend:${{ github.sha }} \
            ./backend

      - name: Push Backend Image
        run: |
          docker push ${REGISTRY}/book-backend:latest
          docker push ${REGISTRY}/book-backend:${{ github.sha }}

      - name: Build Frontend Image
        env:
          PRIMEUI_LICENSE: ${{ secrets.PRIMEUI_LICENSE }}
          DOCKER_BUILDKIT: "1"
        run: |
          # Licence key passed as a BuildKit secret (not a build-arg): not stored in the image history.
          docker build \
            --platform linux/amd64 \
            --secret id=primeui_license,env=PRIMEUI_LICENSE \
            -t ${REGISTRY}/book-frontend:latest \
            -t ${REGISTRY}/book-frontend:${{ github.sha }} \
            ./frontend

      - name: Push Frontend Image
        run: |
          docker push ${REGISTRY}/book-frontend:latest
          docker push ${REGISTRY}/book-frontend:${{ github.sha }}

      # CI holds only the SSH deploy key + registry credentials. NO application secrets:
      # the LXC pulls them from Infisical at start (see deploy/redeploy.sh, docs/DEPLOYMENT.md).
      - name: Copy deploy files to the book-management LXC
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VM_SSH_PORT }}
          source: "deploy/compose.prod.yml,deploy/redeploy.sh"
          target: /opt/book-management
          strip_components: 0

      - name: Redeploy (pull, inject secrets, restart, health check, auto-rollback)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VM_SSH_PORT }}
          script: |
            chmod +x /opt/book-management/deploy/redeploy.sh
            /opt/book-management/deploy/redeploy.sh ${{ github.sha }}
