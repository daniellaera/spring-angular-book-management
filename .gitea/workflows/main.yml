name: Deploy Spring and Angular App

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  packages: write  # Required for GHCR

jobs:
  # 1. Filters which parts (backend/frontend) have changed
  detect-changes:
    name: Determine Changes
    runs-on: ubuntu-latest
    container: 192.168.1.103:3000/daniellaera/ci-java21-node24:24.04-1
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Login to Gitea Registry
        run: echo "${{ secrets.GIT_PASSWORD }}" | docker login 192.168.1.103:3000 -u "${{ secrets.GIT_USERNAME }}" --password-stdin

      - uses: actions/checkout@v4
      # Using dorny/paths-filter (compatible with Gitea Actions)
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  # 2. Backend Build, Test, and Push to Nexus
  build-and-test-backend:
    name: Build and Test Application (Backend)
    runs-on: ubuntu-latest
    container: 192.168.1.103:3000/daniellaera/ci-java21-node24:24.04-1
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Maven Settings
        run: |
          mkdir -p ~/.m2
          echo "${{ secrets.MAVEN_SETTINGS_XML }}" | base64 --decode > ~/.m2/settings.xml

      # Generate version BEFORE build
      - name: Set Version
        run: |
          VERSION="1.1.${{ github.run_number }}"
          echo "Building version: ${VERSION}"
          cd backend
          mvn versions:set -DnewVersion=${VERSION}

      - name: Build and Test Backend
        working-directory: ./backend
        run: mvn clean verify

      - name: Deploy to Nexus
        working-directory: ./backend
        run: mvn clean deploy -Prelease

      # ❌ Disabled on Gitea:
      # - name: Upload JaCoCo Coverage Report (Backend)
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: jacoco-report-backend
      #     path: backend/target/site/jacoco

      # ❌ Disabled on Gitea:
      # - name: Generate JaCoCo Badge (Backend)
      #   id: generate_badge_backend
      #   uses: cicirello/jacoco-badge-generator@v2
      #   with:
      #     jacoco-csv-file: backend/target/site/jacoco/jacoco.csv
      #     badges-directory: .github/badges
      #     generate-coverage-badge: true
      #     coverage-badge-filename: jacoco.svg
      #     generate-coverage-endpoint: true
      #     coverage-endpoint-filename: jacoco.json

      # ❌ Disabled on Gitea:
      # - name: Commit and push badges to badges branch (Backend)
      #   if: ${{ github.event_name != 'pull_request' }}
      #   run: |
      #     git config --global user.name 'github-actions'
      #     git config --global user.email 'github-actions[bot]@users.noreply.github.com'
      #     git checkout -B badges
      #     mkdir -p badges
      #     cp .github/badges/jacoco.svg badges/
      #     cp .github/badges/jacoco.json badges/
      #     git add badges/*
      #     git commit -m "Update JaCoCo coverage badges" || echo "No changes to commit"
      #     git push origin badges --force

  build-and-test-frontend:
    name: Build and Test Application (Frontend)
    runs-on: ubuntu-latest
    container: 192.168.1.103:3000/daniellaera/ci-java21-node24:24.04-1
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Tests
        working-directory: ./frontend
        run: npm run test -- --watch=false

  dockerize-and-deploy:
    name: Build Images & Deploy to Gitea
    runs-on: ubuntu-latest
    container: 192.168.1.103:3000/daniellaera/ci-java21-node24:24.04-1
    needs: [ build-and-test-backend, build-and-test-frontend ]
    steps:
      - uses: actions/checkout@v4

      # ⚠️ Decode Maven settings and place inside backend context for Dockerfile use
      - name: Prepare Maven settings for Docker
        run: |
          mkdir -p backend/.m2
          echo "${{ secrets.MAVEN_SETTINGS_XML }}" | base64 --decode > backend/.m2/settings.xml

      - name: Log in to Nexus
        uses: docker/login-action@v3
        with:
          registry: docker.nexus.daniellaera.com
          username: ${{ secrets.NEXUS_USER }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Generate Version
        id: version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build Backend Image
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg APP_VERSION=${{ steps.version.outputs.version }} \
            -t docker.nexus.daniellaera.com/book-backend:latest \
            -t docker.nexus.daniellaera.com/book-backend:${{ steps.version.outputs.version }} \
            -t docker.nexus.daniellaera.com/book-backend:${{ github.sha }} \
            ./backend

      - name: Push Backend Image
        run: |
          docker push docker.nexus.daniellaera.com/book-backend:latest
          docker push docker.nexus.daniellaera.com/book-backend:${{ github.sha }}

      - name: Build Frontend Image
        run: |
          docker build \
            --platform linux/amd64 \
            -t docker.nexus.daniellaera.com/book-frontend:latest \
            -t docker.nexus.daniellaera.com/book-frontend:${{ github.sha }} \
            ./frontend

      - name: Push Frontend Image
        run: |
          docker push docker.nexus.daniellaera.com/book-frontend:latest
          docker push docker.nexus.daniellaera.com/book-frontend:${{ github.sha }}

      # CI holds only the SSH deploy key + registry credentials. NO application secrets:
      # the LXC pulls them from Infisical at start (see deploy/redeploy.sh, docs/DEPLOYMENT.md).
      - name: Copy deploy files to the book-management LXC
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VM_SSH_PORT }}
          source: "deploy/compose.prod.yml,deploy/redeploy.sh"
          target: /opt/book-management
          strip_components: 0

      - name: Redeploy (pull, inject secrets, restart, health check, auto-rollback)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VM_SSH_PORT }}
          script: |
            chmod +x /opt/book-management/deploy/redeploy.sh
            /opt/book-management/deploy/redeploy.sh ${{ github.sha }}
