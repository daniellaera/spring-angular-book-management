spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_SECRET}
            redirect-uri: ${GITHUB_REDIRECT_URI}

  ai:
    mcp:
      server:
        name: book-library
        version: 1.0.0
        type: SYNC
        protocol: STATELESS            # streamable HTTP without sessions: read-only tools need none
        instructions: "Read-only catalogue of a private book library: search, details, counts, by author, by genre."
        streamable-http:
          mcp-endpoint: /mcp
        request-timeout: 20s
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-haiku-5-5}
          max-tokens: 1024
          # No temperature/top-p/top-k on purpose: Claude 5.x rejects non-default sampling params (HTTP 400).
          # Spring AI 2.0.0-M2 sends none by default. Lowest "effort"/thinking is not exposed by this version
          # (it is only in the SDK-based 2.0.2+/2.1.x rewrite, which has different properties) - revisit on upgrade.

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  jwtRefreshExpirationMs: 86400000

frontend:
  url: ${FRONTEND_URL}

social:
  feature:
    oauth2:
      enabled: true

quartz:
  scheduler:
    cron: "0 0 0 * * ?"  # Every day at midnight

app:
  version: @project.version@
  build-time: @maven.build.timestamp@
  indexing:
    # Qdrant indexing, replaces the n8n nightly "book-index" workflow (see docs/AI.md)
    scheduled:
      enabled: ${APP_INDEXING_SCHEDULED_ENABLED:true}   # nightly full (incremental) reindex
      cron: ${APP_INDEXING_SCHEDULED_CRON:0 0 0 * * *}  # Spring 6-field cron: sec min hour day month weekday
      zone: ${APP_INDEXING_SCHEDULED_ZONE:}             # e.g. Europe/Zurich; empty = JVM default time zone
    on-change:
      enabled: ${APP_INDEXING_ON_CHANGE_ENABLED:true}   # index/remove the single book right after create/delete

qdrant:
  url: ${QDRANT_URL}
  collection: books
  init-collection: true   # create the collection (768, Cosine) on startup if missing
  score-threshold: 0      # 0 = off; set e.g. 0.5 once tuned from the DEBUG score logs

ai:
  enabled: true
  daily-limit: 20
  anonymous-daily-limit: 5   # per client IP, for the public /ask/stream endpoint
  search-limit: 15
  max-tool-calls: 3          # max tool calls per chat question

mcp:
  api-token: ${MCP_API_TOKEN:}   # Authorization: Bearer for /mcp (MCP server); the endpoint answers 401 to everyone when empty
  rate-limit-per-minute: 60

index:
  api-token: ${INDEX_API_TOKEN:}   # X-Index-Token for the n8n nightly /index call; disabled when empty

ollama:
  api-url: ${OLLAMA_URL}

server:
  forward-headers-strategy: framework

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
