<header class="nav" [class.nav--scrolled]="scrolled()">
  <div class="container nav__inner">

    <a routerLink="/books" class="brand">
      <span class="brand__mark" aria-hidden="true">B</span>
      <span class="brand__name">Book Management</span>
    </a>

    <nav class="nav__links" aria-label="Main">
      <a routerLink="/books" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: false }">
        <i class="pi pi-book" aria-hidden="true"></i><span>Library</span>
      </a>
      <a routerLink="/create-book" routerLinkActive="is-active">
        <i class="pi pi-plus" aria-hidden="true"></i><span>Add book</span>
      </a>
    </nav>

    <div class="nav__right">
      @if (isLoggedIn() && timeLeft() > 0) {
        <span class="session" [class.session--low]="sessionLow()" title="Time left in this session">
          <i class="pi pi-clock" aria-hidden="true"></i>
          <span class="sr-only">Session time left:</span>
          <span class="tnum" aria-hidden="true">{{ timeLabel() }}</span>
        </span>
      }

      <button type="button" class="icon-btn" (click)="openAssistant()" aria-label="Open the library assistant">
        <i class="pi pi-sparkles ai" aria-hidden="true"></i>
      </button>

      <button type="button" class="icon-btn" (click)="theme.toggle()"
              [attr.aria-label]="theme.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
              [attr.aria-pressed]="theme.isDark()">
        <i class="pi" [class.pi-sun]="theme.isDark()" [class.pi-moon]="!theme.isDark()" aria-hidden="true"></i>
      </button>

      @if (isLoggedIn()) {
        <button type="button" class="user" (click)="menu.toggle($event)" aria-haspopup="menu"
                >
          <span class="user__avatar" aria-hidden="true">{{ initials() }}</span>
          <span class="user__name">{{ fullName() }}</span><span class="sr-only">, account menu</span>
          @if (hasGitHub()) { <i class="pi pi-github user__gh" aria-hidden="true"></i> }
          <i class="pi pi-chevron-down user__chev" aria-hidden="true"></i>
        </button>
        <p-menu #menu [model]="menuItems" [popup]="true" appendTo="body" />
      } @else {
        <a routerLink="/login" class="link-btn">Sign in</a>
        <a routerLink="/signup" class="cta-btn">Sign up</a>
      }
    </div>

  </div>
</header>
