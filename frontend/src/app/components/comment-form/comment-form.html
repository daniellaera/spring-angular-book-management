<form class="comment-form" (submit)="$event.preventDefault(); submitComment()">
  <label for="comment-text" class="comment-form__label">Add a comment</label>
  <textarea pTextarea id="comment-text" name="comment" [(ngModel)]="commentContent" placeholder="What did you think of it?"
            rows="3" maxlength="500" [disabled]="isSubmitting()" [attr.aria-describedby]="'comment-count'"></textarea>
  <div class="comment-form__row">
    <small id="comment-count" class="muted tnum">{{ commentContent().length }}/500</small>
    <p-button type="submit" [label]="getButtonLabel()" icon="pi pi-send" [disabled]="isSubmitDisabled()" [loading]="isSubmitting()" />
  </div>
  @if (errorMessage()) {
    <p-message severity="error" size="small" variant="simple">{{ errorMessage() }}</p-message>
  }
  @if (!authService.isLoggedIn()) {
    <p class="muted small"><i class="pi pi-lock" aria-hidden="true"></i> Sign in to post a comment.</p>
  }
</form>
