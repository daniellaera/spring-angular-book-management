<div class="rating-form">
  @if (canRate()) {
    <div class="rating-form__field">
      <p id="rate-label" class="rating-form__label">Your rating</p>
      <p-rating [(ngModel)]="ratingValue" [stars]="5" aria-labelledby="rate-label" />
      @if (errorMessage()) {
        <p-message severity="error" size="small" variant="simple" styleClass="w-full">{{ errorMessage() }}</p-message>
      }
      <p-button label="Submit rating" icon="pi pi-star-fill" [disabled]="!ratingValue() || isSubmitting() || !authService.isLoggedIn()"
                [loading]="isSubmitting()" (onClick)="submitRating()" styleClass="w-full" />
    </div>
  } @else if (authService.isLoggedIn()) {
    <p class="muted"><i class="pi pi-check-circle" aria-hidden="true"></i> You have already rated this book.</p>
  } @else {
    <p class="muted"><i class="pi pi-lock" aria-hidden="true"></i> Sign in to rate this book.</p>
  }
</div>
<p-toast />
