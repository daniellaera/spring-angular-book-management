<div class="container form-page narrow">
  <p-toast />
  <div class="panel form-card rise">
    <div class="form-card__head">
      <p class="eyebrow">Account</p>
      <h1>Profile</h1>
      <p>Update how your name appears on comments and borrows.</p>
    </div>

    <form class="form-grid" (ngSubmit)="saveProfile()" novalidate>
      <div class="form-field">
        <label for="email">Email</label>
        <input pInputText id="email" type="email" name="email" [ngModel]="email()" [disabled]="true" />
        <span class="hint">The email cannot be changed.</span>
      </div>

      <div class="form-grid form-grid--2">
        <div class="form-field">
          <label for="firstName">First name</label>
          <input pInputText id="firstName" type="text" name="firstName" autocomplete="given-name"
                 [(ngModel)]="firstName" (ngModelChange)="validateFirstName()" [invalid]="!!firstNameError()"
                 [attr.aria-invalid]="firstNameError() ? 'true' : null" [attr.aria-describedby]="firstNameError() ? 'fn-error' : null" required />
          @if (firstNameError()) { <p id="fn-error" class="field-error" role="alert"><i class="pi pi-exclamation-circle" aria-hidden="true"></i>{{ firstNameError() }}</p> }
        </div>
        <div class="form-field">
          <label for="lastName">Last name</label>
          <input pInputText id="lastName" type="text" name="lastName" autocomplete="family-name"
                 [(ngModel)]="lastName" (ngModelChange)="validateLastName()" [invalid]="!!lastNameError()"
                 [attr.aria-invalid]="lastNameError() ? 'true' : null" [attr.aria-describedby]="lastNameError() ? 'ln-error' : null" required />
          @if (lastNameError()) { <p id="ln-error" class="field-error" role="alert"><i class="pi pi-exclamation-circle" aria-hidden="true"></i>{{ lastNameError() }}</p> }
        </div>
      </div>

      <div class="form-actions">
        <p-button type="submit" label="Save changes" icon="pi pi-check" size="large" [loading]="loading()" [disabled]="!isFormValid() || loading()" />
        <p-button type="button" label="Cancel" severity="secondary" [outlined]="true" size="large" (onClick)="cancel()" />
      </div>
    </form>
  </div>
</div>
