<div class="container form-page narrow">
  <p-toast />
  <div class="panel form-card rise">
    <div class="form-card__head">
      <p class="eyebrow">New entry</p>
      <h1>Add a book</h1>
      <p>It becomes searchable by meaning as soon as it is saved.</p>
    </div>

    <form class="form-grid" (ngSubmit)="submitForm()">
      <div class="form-field">
        <label for="title">Title <span class="req" aria-hidden="true">*</span></label>
        <input pInputText id="title" type="text" name="title" [(ngModel)]="book().title" placeholder="e.g. Clean Architecture" required />
      </div>

      <div class="form-grid form-grid--2">
        <div class="form-field">
          <label for="author">Author <span class="req" aria-hidden="true">*</span></label>
          <input pInputText id="author" type="text" name="author" [(ngModel)]="book().author" placeholder="e.g. Robert C. Martin" required />
        </div>
        <div class="form-field">
          <label for="genre">Genre</label>
          <input pInputText id="genre" type="text" name="genre" [(ngModel)]="book().genre" list="genre-options" placeholder="Pick or type a genre" autocomplete="off" />
          <datalist id="genre-options">
            @for (g of genreSuggestions; track g) { <option [value]="g"></option> }
          </datalist>
        </div>
      </div>

      <div class="form-grid form-grid--2">
        <div class="form-field">
          <label for="isbn">ISBN <span class="req" aria-hidden="true">*</span></label>
          <input pInputText id="isbn" type="text" name="isbn" [(ngModel)]="book().isbn" placeholder="978-…" inputmode="numeric" required />
        </div>
        <div class="form-field">
          <label for="publishedDate">Published <span class="req" aria-hidden="true">*</span></label>
          <p-datepicker inputId="publishedDate" name="publishedDate" [(ngModel)]="book().publishedDate" [showIcon]="true"
                        dateFormat="dd/mm/yy" placeholder="dd/mm/yyyy" styleClass="w-full" [inputStyle]="{ width: '100%' }" appendTo="body" required />
        </div>
      </div>

      <div class="form-field">
        <label for="description">Description <span class="req" aria-hidden="true">*</span></label>
        <textarea pTextarea id="description" name="description" [(ngModel)]="book().description" rows="5"
                  placeholder="A sentence or two about what the book is about. This text is what semantic search understands." required></textarea>
        <span class="hint">Good descriptions make "Ask your library" results better.</span>
      </div>

      <div class="form-actions">
        <p-button type="submit" label="Create book" icon="pi pi-check" size="large" [loading]="loading()" [disabled]="!isFormValid() || loading()" />
        <p-button type="button" label="Cancel" severity="secondary" [outlined]="true" size="large" (onClick)="cancel()" />
      </div>
    </form>
  </div>
</div>
